name: booking-api

services:

  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?required}
      - --appendonly
      - "yes"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  api:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped

    env_file:
      - ${APP_ENV_FILE:-.env.production}

    environment:
      PORT: 3456
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}

    ports:
      - "127.0.0.1:3456:3456"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3456/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  migrate:
    image: ${IMAGE:?IMAGE is required}

    profiles:
      - tools

    environment:
      DATABASE_URL: ${DATABASE_URL:?required}

    entrypoint: ["/bin/sh", "-c"]
    command: 'exec migrate -path /app/migrations -database "$$DATABASE_URL" up'

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend


volumes:
  pgdata:
  redisdata:


networks:
  backend:
    driver: bridge