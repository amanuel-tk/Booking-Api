services:
  db:
    image: postgres:16
    container_name: auth_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    image: redis:7-alpine
    container_name: auth_redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
