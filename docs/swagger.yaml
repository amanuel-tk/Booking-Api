basePath: /api/v1
definitions:
  github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_booking.BookingView:
    properties:
      cancelled_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      movie_title:
        type: string
      screen_name:
        type: string
      seats:
        items:
          type: string
        type: array
      showtime_id:
        type: string
      starts_at:
        type: string
      status:
        type: string
      theater_name:
        type: string
      total_cents:
        type: integer
    type: object
  internal_booking.CreateRequest:
    properties:
      seat_ids:
        items:
          type: string
        type: array
    type: object
  internal_booking.SeatMap:
    properties:
      available:
        type: integer
      rows:
        items:
          $ref: '#/definitions/internal_booking.SeatMapRow'
        type: array
      screen_id:
        type: string
      showtime_id:
        type: string
    type: object
  internal_booking.SeatMapRow:
    properties:
      row:
        type: string
      seats:
        items:
          $ref: '#/definitions/internal_booking.SeatView'
        type: array
    type: object
  internal_booking.SeatStatus:
    enum:
    - free
    - held
    - booked
    type: string
    x-enum-varnames:
    - SeatFree
    - SeatHeld
    - SeatBooked
  internal_booking.SeatView:
    properties:
      id:
        format: uuid
        type: string
      number:
        example: 1
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/internal_booking.SeatStatus'
        enum:
        - free
        - held
        - booked
    type: object
  internal_hold.Request:
    properties:
      seat_ids:
        items:
          type: string
        type: array
    type: object
  internal_hold.Result:
    properties:
      expires_at:
        type: string
      seat_ids:
        items:
          type: string
        type: array
      showtime_id:
        format: uuid
        type: string
    type: object
  internal_hold.SeatsUnavailableResponse:
    properties:
      error:
        example: some seats are not available
        type: string
      seat_ids:
        items:
          type: string
        type: array
    type: object
  internal_movie.CreateRequest:
    properties:
      description:
        example: A science fiction thriller
        type: string
      duration_minutes:
        example: 148
        maximum: 600
        minimum: 1
        type: integer
      genres:
        items:
          type: string
        type: array
      language:
        example: English
        type: string
      poster_url:
        example: https://example.com/poster.jpg
        type: string
      release_date:
        example: "2010-07-16"
        format: date
        type: string
      title:
        example: Inception
        maxLength: 200
        type: string
    type: object
  internal_movie.ListMoviesResponse:
    properties:
      limit:
        example: 20
        type: integer
      movies:
        items:
          $ref: '#/definitions/internal_movie.Movie'
        type: array
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
    type: object
  internal_movie.Movie:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      is_active:
        type: boolean
      language:
        type: string
      poster_url:
        type: string
      release_date:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_showtime.CreateShowtimeRequest:
    properties:
      movie_id:
        format: uuid
        type: string
      price_cents:
        example: 15000
        maximum: 10000000
        minimum: 0
        type: integer
      screen_id:
        format: uuid
        type: string
      starts_at:
        example: "2026-12-20T18:00:00+03:00"
        type: string
    type: object
  internal_showtime.ListItem:
    properties:
      ends_at:
        type: string
      id:
        type: string
      price_cents:
        type: integer
      screen_id:
        type: string
      screen_name:
        type: string
      starts_at:
        type: string
      theater_id:
        type: string
      theater_name:
        type: string
    type: object
  internal_showtime.Showtime:
    properties:
      created_at:
        type: string
      ends_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      movie_id:
        type: string
      price_cents:
        type: integer
      screen_id:
        type: string
      starts_at:
        type: string
      updated_at:
        type: string
    type: object
  internal_theater.CreateScreenRequest:
    properties:
      name:
        example: screen 1
        maxLength: 100
        type: string
      rows:
        example: 10
        maximum: 26
        minimum: 1
        type: integer
      seats_per_row:
        example: 15
        maximum: 50
        minimum: 1
        type: integer
    type: object
  internal_theater.CreateTheater:
    properties:
      city:
        example: addis ababa
        maxLength: 100
        type: string
      name:
        example: cinema ethiopia
        maxLength: 100
        type: string
    type: object
  internal_theater.Screen:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      row_count:
        type: integer
      seats_per_row:
        type: integer
      theater_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_theater.ScreenLayout:
    properties:
      rows:
        items:
          $ref: '#/definitions/internal_theater.SeatRow'
        type: array
      screen:
        $ref: '#/definitions/internal_theater.Screen'
    type: object
  internal_theater.Seat:
    properties:
      id:
        format: uuid
        type: string
      row_label:
        example: A
        type: string
      seat_number:
        example: 1
        type: integer
    type: object
  internal_theater.SeatRow:
    properties:
      row:
        example: A
        type: string
      seats:
        items:
          $ref: '#/definitions/internal_theater.Seat'
        type: array
    type: object
  internal_theater.Theater:
    properties:
      city:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  internal_user.LoginRequest:
    properties:
      email:
        example: jane@example.com
        format: email
        type: string
      password:
        example: s3cretPass!
        type: string
    type: object
  internal_user.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/internal_user.User'
    type: object
  internal_user.RegisterRequest:
    properties:
      email:
        example: jane@example.com
        format: email
        type: string
      first_name:
        example: Jane
        minLength: 1
        type: string
      last_name:
        example: Doe
        minLength: 1
        type: string
      password:
        example: s3cretPass!
        maxLength: 72
        minLength: 8
        type: string
    type: object
  internal_user.User:
    properties:
      created_at:
        type: string
      email:
        example: jane@example.com
        type: string
      first_name:
        example: jane
        type: string
      id:
        example: 3f2b8c1e-5a7d-4e6f-9b1a-2c3d4e5f6a7b
        format: uuid
        type: string
      is_active:
        type: boolean
      last_name:
        example: doe
        type: string
      permissions:
        items:
          type: string
        type: array
      roles:
        example:
        - user
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: 'Movie booking API: browse movies and showtimes, hold seats, book tickets.'
  title: Booking API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns a 15-minute JWT access token.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_user.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: New account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_user.User'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /me/bookings:
    get:
      description: Retrieve up to 100 bookings belonging to the authenticated user,
        ordered by creation date descending. Includes both confirmed and cancelled
        bookings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_booking.BookingView'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my bookings
      tags:
      - Bookings
  /me/bookings/{id}:
    get:
      description: Retrieve a booking by UUID. Only bookings belonging to the authenticated
        user can be accessed.
      parameters:
      - description: Booking UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_booking.BookingView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my booking
      tags:
      - Bookings
  /me/bookings/{id}/cancel:
    post:
      description: Cancel a confirmed booking belonging to the authenticated user.
        Cancellation is allowed only when the showtime starts at least 2 hours from
        the current time. Successfully cancelled bookings release their seats for
        future bookings.
      parameters:
      - description: Booking UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_booking.BookingView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel my booking
      tags:
      - Bookings
  /movies:
    get:
      description: Retrieve active movies with optional title search and pagination.
        Results are ordered by release date descending. Default page is 1, default
        limit is 20, and maximum limit is 100.
      parameters:
      - description: Search movies by title
        in: query
        name: q
        type: string
      - default: 1
        description: Page number (default 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Movies per page (default 20, max 100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_movie.ListMoviesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: List movies
      tags:
      - Movies
    post:
      consumes:
      - application/json
      description: Create a new movie. Title is required (max 200 characters), duration
        must be between 1 and 600 minutes, and release_date must use YYYY-MM-DD format.
        Requires admin access.
      parameters:
      - description: Movie details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_movie.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_movie.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a movie
      tags:
      - Movies
  /movies/{id}:
    get:
      description: Retrieve an active movie by its UUID. Returns 404 if the movie
        does not exist or is inactive.
      parameters:
      - description: Movie UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_movie.Movie'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Get a movie
      tags:
      - Movies
  /movies/{id}/showtimes:
    get:
      description: Retrieve upcoming showtimes for a movie within a date range. Dates
        use YYYY-MM-DD. The "date" parameter is an alternative to "from". If no dates
        are provided, today's date is used. The range is limited to 31 days.
      parameters:
      - description: Movie UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        example: "2026-12-20"
        in: query
        name: from
        type: string
      - description: End date, inclusive (YYYY-MM-DD)
        example: "2026-12-25"
        in: query
        name: to
        type: string
      - description: Alternative start date if from is omitted (YYYY-MM-DD)
        example: "2026-12-20"
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_showtime.ListItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: List movie showtimes
      tags:
      - Showtimes
  /screens/{id}:
    get:
      description: Retrieve a screen and its seats grouped by row. Each row contains
        its label and corresponding seats.
      parameters:
      - description: Screen UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_theater.ScreenLayout'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Get screen layout
      tags:
      - Screens
  /showtimes:
    post:
      consumes:
      - application/json
      description: Schedule a movie on a screen. The start time must be in the future.
        The end time is calculated from the movie duration plus a 15-minute cleaning
        buffer. Overlapping showtimes on the same screen are rejected. Requires admin
        access.
      parameters:
      - description: Showtime details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_showtime.CreateShowtimeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_showtime.Showtime'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a showtime
      tags:
      - Showtimes
  /showtimes/{id}:
    get:
      description: Retrieve an active showtime by its UUID, including its movie, screen,
        start time, end time, and ticket price.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_showtime.Showtime'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Get a showtime
      tags:
      - Showtimes
  /showtimes/{id}/bookings:
    post:
      consumes:
      - application/json
      description: Create a confirmed booking for 1 to 6 seats. The user must own
        valid Redis holds for all requested seats. The showtime must be in the future
        and all seats must belong to its screen. The total price is calculated by
        the server.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Seat IDs to book
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_booking.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_booking.BookingView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm a seat booking
      tags:
      - Bookings
  /showtimes/{id}/holds:
    post:
      consumes:
      - application/json
      description: Temporarily reserve 1 to 6 seats for the authenticated user. The
        showtime must exist and must not have started. All seats must belong to the
        showtime's screen and must not already be booked or held by another user.
        Holds expire automatically after the configured Redis TTL.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Seat IDs to hold
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_hold.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_hold.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_hold.SeatsUnavailableResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hold seats for a showtime
      tags:
      - Seat Holds
  /showtimes/{id}/seats:
    get:
      description: Retrieve all seats for a showtime grouped by row. Each seat has
        a status of free, held, or booked. Booked seats take precedence over temporary
        Redis holds.
      parameters:
      - description: Showtime UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_booking.SeatMap'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: Get showtime seat availability
      tags:
      - Bookings
  /theaters:
    get:
      description: Retrieve all active theaters ordered by creation date. Returns
        an empty array if no theaters exist.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_theater.Theater'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: List theaters
      tags:
      - Theaters
    post:
      consumes:
      - application/json
      description: Create a new theater. The theater name and city must be provided
        and cannot exceed 100 characters. Requires admin access.
      parameters:
      - description: Theater details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_theater.CreateTheater'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_theater.Theater'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a theater
      tags:
      - Theaters
  /theaters/{id}/screens:
    get:
      description: Retrieve all active screens belonging to a theater. Returns an
        empty array if no active screens exist.
      parameters:
      - description: Theater UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_theater.Screen'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      summary: List theater screens
      tags:
      - Screens
    post:
      consumes:
      - application/json
      description: Create a screen in a theater and automatically generate its seats.
        Rows must be between 1 and 26, and seats per row must be between 1 and 50.
        Requires admin access.
      parameters:
      - description: Theater UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Screen details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_theater.CreateScreenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_theater.Screen'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_amanuel-tk_Booking-Api_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a screen
      tags:
      - Screens
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
